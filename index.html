<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>テキスト色別集計アドイン</title>

  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <h1>テキスト色別集計</h1>

    <p>
      現在のスライドから、文字色が
      <strong>RGB(0,112,192)</strong>
      の数字を取得して合計します。
    </p>

    <button id="sumButton" type="button">
      青文字の数字を集計
    </button>

    <div class="resultBox">
      <div>対象色：#0070c0</div>
      <div id="result">未集計</div>
    </div>
  </main>

  <script src="./taskpane.js"></script>
</body>
</html>
