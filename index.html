<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>社内ツール</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <link rel="stylesheet" href="./style.css?v=18" />
</head>
<body>
  <main class="container">

    <div class="app-header">
      <h1>外壁調査ツール</h1>
    </div>

    <nav class="tabs" aria-label="機能切り替え">
      <button id="importTabButton" class="tabButton active" type="button" data-tab-target="importTab">
        図面取込
      </button>
      <button id="summaryTabButton" class="tabButton" type="button" data-tab-target="summaryTab">
        集計
      </button>
      <button id="tableTabButton" class="tabButton" type="button" data-tab-target="tableTab">
        表作成
      </button>
      <button id="summaryCollectTabButton" class="tabButton" type="button" data-tab-target="summaryCollectTab">
        集計まとめ
      </button>
    </nav>

    <!-- 図面取込タブ -->
    <section id="importTab" class="tabContent active">

      <p class="section-label">PDFを取り込む</p>

      <div id="pdfDropZone" class="pdf-drop-zone">
        <div class="pdf-drop-icon">📄</div>
        <p class="pdf-drop-text">PDFをここにドロップ</p>
        <p class="pdf-drop-sub">または</p>
        <label class="pdf-file-label">
          ファイルを選択
          <input id="pdfFileInput" type="file" accept=".pdf" style="display:none">
        </label>
      </div>

      <div id="pdfStatus" class="pdf-status" style="display:none"></div>

      <div id="pdfPreviewArea" class="pdf-preview-area" style="display:none">
        <p class="section-label">プレビュー</p>
        <div id="pdfPreviewList" class="pdf-preview-list"></div>
        <button id="pdfInsertButton" type="button" class="output-btn" style="margin-top:10px">
          スライドに挿入
        </button>
      </div>

    </section>

    <!-- 集計タブ -->
    <section id="summaryTab" class="tabContent">

      <p class="section-label">固定色で集計</p>
      <div class="action-list">
        <button id="sumGreenButton" type="button" class="action-btn green">
          <span class="btn-dot"></span>
          <span class="btn-label">
            タイル割れを集計
            <span class="btn-sub">RGB(0, 176, 80)</span>
          </span>
        </button>
        <button id="sumBlueButton" type="button" class="action-btn blue">
          <span class="btn-dot"></span>
          <span class="btn-label">
            タイル浮きを集計
            <span class="btn-sub">RGB(0, 112, 192)</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">選択色で集計</p>
      <div class="action-list">
        <button id="sumSelectedColorButton" type="button" class="action-btn gray">
          <span class="btn-dot"></span>
          <span class="btn-label">
            文字色で集計
            <span class="btn-sub">文字を選択してから実行</span>
          </span>
        </button>
        <button id="sumSelectedTextAndFillColorButton" type="button" class="action-btn gray">
          <span class="btn-dot"></span>
          <span class="btn-label">
            文字色＋背景色で集計
            <span class="btn-sub">文字を選択してから実行</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">面積を集計</p>
      <div class="action-list">
        <button id="sumAreaByColorButton" type="button" class="action-btn gray">
          <span class="btn-dot"></span>
          <span class="btn-label">
            文字色の面積を集計
            <span class="btn-sub">0.5x1.5 の形式を計算して集計</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">エフロを集計</p>
      <div class="action-list">
        <button id="sumEfuroButton" type="button" class="action-btn red">
          <span class="btn-dot"></span>
          <span class="btn-label">
            「エ」を集計(エ ←集計不可、エ1 ←集計可能)
            <span class="btn-sub">「エ1」の形式の数字部分を集計</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">爆裂を集計</p>
      <div class="action-list">
        <button id="sumBakuretsuButton" type="button" class="action-btn red">
          <span class="btn-dot"></span>
          <span class="btn-label">
            「バ」を集計(バ ←集計不可、バ1 ←集計可能)
            <span class="btn-sub">「バ1」の形式の数字部分を集計</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">その他の赤文字を集計</p>
      <div class="action-list">
        <button id="collectRedTextButton" type="button" class="action-btn red">
          <span class="btn-dot"></span>
          <span class="btn-label">
            その他赤文字集計
            <span class="btn-sub">このスライド1枚の赤文字を出力</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">写真番号を集計</p>
      <div class="action-list">
        <button id="formatBlackCodeButton" type="button" class="action-btn dark">
          <span class="btn-dot"></span>
          <span class="btn-label">
            このスライドの写真番号を集計
            <span class="btn-sub">このスライド1枚の写真番号を集計</span>
          </span>
        </button>
        <button id="formatAllSlidesBlackCodeButton" type="button" class="action-btn dark">
          <span class="btn-dot"></span>
          <span class="btn-label">
            全スライドの写真番号を集計
            <span class="btn-sub">全てのスライドの写真番号を集計</span>
          </span>
        </button>
      </div>

    </section>

    <!-- 集計まとめタブ -->
    <section id="summaryCollectTab" class="tabContent">

      <p class="section-label">集計まとめ</p>
      <div class="action-list">
        <button id="collectSummaryButton" type="button" class="action-btn teal">
          <span class="btn-dot"></span>
          <span class="btn-label">
            集計表を収集
            <span class="btn-sub">全スライドの＜集計＞表を一覧表示</span>
          </span>
        </button>
      </div>

      <div id="summaryCollectStatus" class="summary-collect-status" style="display:none"></div>
      <div id="summaryCollectTableWrap" class="summary-collect-wrap"></div>

    </section>

    <!-- 表作成タブ -->
    <section id="tableTab" class="tabContent">

      <!-- 項目追加（折りたたみ式） -->
      <p class="section-label">項目を追加</p>
      <div id="defectButtonGrid" class="defectButtonGrid"></div>

      <div class="section-divider">
        <span class="section-divider__label">行一覧</span>
      </div>
      <div class="tableHeader" aria-hidden="true">
        <div></div>
        <div>内容</div>
        <div>数量</div>
        <div>単位</div>
        <div></div>
      </div>

      <div id="tableRows" class="tableRows"></div>

      <!-- アクション -->
      <div class="tableActionArea">
        <div class="table-output-row">
          <button id="autoSumButton" type="button" class="output-btn output-btn--sub">
            自動集計
          </button>
          <button id="outputTableButton" type="button" class="output-btn">
            凡例表出力
          </button>
          <button id="outputSumTableButton" type="button" class="output-btn output-btn--green">
            集計表出力
          </button>
        </div>
        <button id="clearTableRowsButton" type="button" class="clear-btn">
          行をすべて削除
        </button>
      </div>

    </section>

    <div class="scroll-pad"></div>
  </main>

  <footer class="result-footer" style="display:none">
    <span id="targetColor" hidden></span>
    <div class="result-footer-row">
      <div id="result" class="result-total">未集計</div>
      <button id="copyResultButton" type="button" class="copy-btn" title="クリップボードにコピー">
        コピー
      </button>
    </div>
  </footer>
  <script src="./taskpane.js?v=18"></script>
</body>
</html>
