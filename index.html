<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>社内ツール</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="./style.css?v=18" />
</head>
<body>
  <main class="container">

    <div class="app-header">
      <h1>外壁調査ツール</h1>
    </div>

    <nav class="tabs" aria-label="機能切り替え">
      <button id="summaryTabButton" class="tabButton active" type="button" data-tab-target="summaryTab">
        集計
      </button>
      <button id="tableTabButton" class="tabButton" type="button" data-tab-target="tableTab">
        表作成
      </button>
    </nav>

    <!-- 集計タブ -->
    <section id="summaryTab" class="tabContent active">

      <p class="section-label">固定色で集計</p>
      <div class="action-list">
        <button id="sumBlueButton" type="button" class="action-btn blue">
          <span class="btn-dot"></span>
          <span class="btn-label">
            タイル浮きを集計
            <span class="btn-sub">RGB(0, 112, 192)</span>
          </span>
        </button>
        <button id="sumGreenButton" type="button" class="action-btn green">
          <span class="btn-dot"></span>
          <span class="btn-label">
            タイル割れを集計
            <span class="btn-sub">RGB(0, 176, 80)</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">選択色で集計</p>
      <div class="action-list">
        <button id="sumSelectedColorButton" type="button" class="action-btn gray">
          <span class="btn-dot"></span>
          <span class="btn-label">
            文字色で集計
            <span class="btn-sub">文字を選択してから実行</span>
          </span>
        </button>
        <button id="sumSelectedTextAndFillColorButton" type="button" class="action-btn gray">
          <span class="btn-dot"></span>
          <span class="btn-label">
            文字色＋背景色で集計
            <span class="btn-sub">文字を選択してから実行</span>
          </span>
        </button>
      </div>

      <div class="divider"></div>
      <p class="section-label">写真番号を集計</p>
      <div class="action-list">
        <button id="formatBlackCodeButton" type="button" class="action-btn dark">
          <span class="btn-dot"></span>
          <span class="btn-label">
            このスライドの写真番号を集計
            <span class="btn-sub">このスライド1枚の写真番号を集計</span>
          </span>
        </button>
        <button id="formatAllSlidesBlackCodeButton" type="button" class="action-btn dark">
          <span class="btn-dot"></span>
          <span class="btn-label">
            全スライドの写真番号を集計
            <span class="btn-sub">全てのスライドの写真番号を集計</span>
          </span>
        </button>
      </div>

    </section>

    <!-- 表作成タブ -->
    <section id="tableTab" class="tabContent">

      <!-- 項目追加（折りたたみ式） -->
      <p class="section-label">項目を追加</p>
      <div id="defectButtonGrid" class="defectButtonGrid"></div>

      <div class="divider"></div>

      <!-- 追加された行 -->
      <p class="section-label">行一覧</p>
      <div class="tableHeader" aria-hidden="true">
        <div></div>
        <div>内容</div>
        <div>数量</div>
        <div>単位</div>
        <div></div>
      </div>

      <div id="tableRows" class="tableRows"></div>

      <!-- アクション -->
      <div class="tableActionArea">
        <div class="action-list" style="margin-bottom:0">
          <button id="autoSumButton" type="button" class="action-btn teal">
            <span class="btn-dot"></span>
            <span class="btn-label">
              自動集計
              <span class="btn-sub">丸の色で数量を自動入力</span>
            </span>
          </button>
        </div>
        <div class="table-output-row">
          <button id="outputTableButton" type="button" class="output-btn">
            凡例表出力
          </button>
          <button id="outputSumTableButton" type="button" class="output-btn output-btn--green">
            集計表出力
          </button>
        </div>
        <button id="clearTableRowsButton" type="button" class="clear-btn">
          行をすべて削除
        </button>
      </div>

    </section>

    <div class="scroll-pad"></div>
  </main>

  <footer class="result-footer">
    <span id="targetColor" hidden></span>
    <div class="result-footer-row">
      <div id="result" class="result-total">未集計</div>
      <button id="copyResultButton" type="button" class="copy-btn" title="クリップボードにコピー">
        コピー
      </button>
    </div>
  </footer>
  <script src="./taskpane.js?v=18"></script>
</body>
</html>
